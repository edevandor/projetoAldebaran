[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-aldebaran"
version = "0.2.0"
description = "Pipeline de consolidação de histórico comercial preso em relatórios de ERP legado, publicado como Parquet consultável em SQL."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Edevandor", email = "edevandor@users.noreply.github.com" },
]
keywords = ["etl", "bi", "pipeline", "erp", "analytics", "parquet", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=0.10",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dateutil>=2.8",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff",
]

[project.scripts]
aldebaran = "cli:main"

[project.urls]
Repository = "https://github.com/edevandor/projetoAldebaran"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["cli", "pipeline"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = [
    "analytics*",
    "audit*",
    "consolidation*",
    "demo*",
    "export*",
    "ingestion*",
    "query*",
    "transformation*",
    "validation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
